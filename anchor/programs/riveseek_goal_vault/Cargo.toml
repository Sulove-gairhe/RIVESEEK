[package]
name = "riveseek_goal_vault"
version = "0.1.0"
description = "RiveSeek SPL-token goal vault program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "riveseek_goal_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = { version = "1.1.2", features = ["token"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-sdk = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }



